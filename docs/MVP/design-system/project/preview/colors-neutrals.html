<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatch { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
  .chip { height: 64px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
  .meta { padding: 6px 10px; }
  .name { font-size: 12px; font-weight: 500; color: var(--ink); display: block; }
  .hex  { font-size: 11px; font-family: var(--font-mono); color: var(--ink-muted); }
  .role { padding: 0 10px 8px; font-size: 11px; color: var(--ink-muted); }
</style></head>
<body>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#1C1A1E;color:#fff">Aa</div>
      <div class="meta"><span class="name">Ink</span><span class="hex">#1C1A1E</span></div>
      <div class="role">Body · tables</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#6B6270;color:#fff">Aa</div>
      <div class="meta"><span class="name">Ink muted</span><span class="hex">#6B6270</span></div>
      <div class="role">Secondary text</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#F7F5F3;color:#1C1A1E;border-bottom:1px solid var(--border)">Aa</div>
      <div class="meta"><span class="name">Page bg</span><span class="hex">#F7F5F3</span></div>
      <div class="role">App background</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#FFFFFF;color:#1C1A1E;border-bottom:1px solid var(--border)">Aa</div>
      <div class="meta"><span class="name">Surface</span><span class="hex">#FFFFFF</span></div>
      <div class="role">Cards · panels</div>
    </div>
  </div>
</body></html>
