<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Headings</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); }
  .stack > * + * { margin-top: 12px; }
  .eyebrow { font-size: 11px; font-weight: 500; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
</style></head>
<body>
  <div class="stack">
    <div class="eyebrow">Sección · presupuesto #1024</div>
    <h1>Pedido fiesta dorada</h1>
    <h2>Resumen del cliente</h2>
    <h3>Insumos incluidos</h3>
    <p style="margin-top:8px">Onest · weight 500 · color <code style="font-family:var(--font-mono);font-size:12px">#8B2570</code> · letter-spacing −0.01em. Toda jerarquía se hace con tamaño, nunca con peso 700.</p>
  </div>
</body></html>
