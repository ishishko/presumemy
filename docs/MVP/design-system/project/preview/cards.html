<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--page-bg); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: var(--shadow-1); }
  .card.highlight { background: var(--lavender); border-color: transparent; }
  .card .eyebrow { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .card.highlight .eyebrow { color: var(--violet-700); }
  .metric { font-size: 28px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 6px; letter-spacing: -0.01em; }
  .trend { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
  .trend strong { color: var(--violet-700); font-weight: 500; }
</style></head>
<body>
<div class="row">
  <div class="card">
    <div class="eyebrow">Ingresos · Mes</div>
    <div class="metric">$ 24,580</div>
    <div class="trend"><strong>+ 12%</strong> vs mes anterior</div>
  </div>
  <div class="card highlight">
    <div class="eyebrow">Por cobrar</div>
    <div class="metric">$ 6,120</div>
    <div class="trend">3 presupuestos pendientes</div>
  </div>
  <div class="card">
    <div class="eyebrow">Insumos bajos</div>
    <div class="metric">4</div>
    <div class="trend">Cinta dorada · papel kraft + 2</div>
  </div>
</div>
</body></html>
