<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .swatch { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
  .chip { height: 70px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 500; font-size: 13px; letter-spacing: 0.02em; }
  .meta { padding: 8px 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .meta .name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .meta .hex  { font-size: 12px; font-family: var(--font-mono); color: var(--ink-muted); }
  .role { padding: 0 12px 10px; font-size: 12px; color: var(--ink-muted); }
</style></head>
<body>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#8B2570">Aa Heading</div>
      <div class="meta"><span class="name">Violet</span><span class="hex">#8B2570</span></div>
      <div class="role">Headings · sidebar · active</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#75CCCE">Aa Action</div>
      <div class="meta"><span class="name">Teal</span><span class="hex">#75CCCE</span></div>
      <div class="role">Primary CTA · links · focus</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#EA5F3C">Aa Danger</div>
      <div class="meta"><span class="name">Coral</span><span class="hex">#EA5F3C</span></div>
      <div class="role">Error · destructive only</div>
    </div>
  </div>
</body></html>
